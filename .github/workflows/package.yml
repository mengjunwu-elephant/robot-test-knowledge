name: Build robot test skill package
on:
  pull_request:
  push:
    branches: [main]
    paths: ['standards/**', 'AGENTS.md', 'plugin.json', '.cursor-plugin/**', 'packaging/**', 'skills/**', '.agents/skills/**', 'scripts/**', '.github/workflows/package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -X utf8 scripts/validate_offline.py
      - run: python -X utf8 scripts/test_sync.py
      - run: python -X utf8 -m unittest discover -s scripts -p 'test_*.py'
      - run: python -X utf8 scripts/build_package.py --channel ${{ github.event_name == 'workflow_dispatch' && 'release' || 'candidate' }}
      - name: Validate actual Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath "dist/${{ github.event_name == 'workflow_dispatch' && 'release' || 'candidate' }}" -Filter *.zip | Select-Object -First 1
          $version = (Get-Content -LiteralPath plugin.json -Raw | ConvertFrom-Json).version
          python -X utf8 scripts/test_launcher_windows.py --archive $archive.FullName --launcher "dist/${{ github.event_name == 'workflow_dispatch' && 'release' || 'candidate' }}/robot-test-knowledge-$version-Install.cmd"
      - uses: actions/upload-artifact@v4
        with:
          name: robot-test-package-${{ matrix.os }}
          path: dist/${{ github.event_name == 'workflow_dispatch' && 'release' || 'candidate' }}/*
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'mengjunwu-elephant'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: robot-test-package-ubuntu-latest
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: robot-test-package-windows-latest
          path: dist/windows
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('plugin.json'))['version'])")
          LAUNCHER="robot-test-knowledge-$VERSION-Install.cmd"
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cmp "dist/robot-test-knowledge-$VERSION.zip" "dist/windows/robot-test-knowledge-$VERSION.zip"
          cp "dist/windows/$LAUNCHER" "dist/$LAUNCHER"
          (cd dist && sha256sum "$LAUNCHER" >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Version already exists; keeping published assets unchanged."
          else
            gh release create "v$VERSION" "dist/robot-test-knowledge-$VERSION.zip" "dist/$LAUNCHER" dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "大象机器人测试技能包 v$VERSION" --notes "完整解压后运行 Install.cmd，或下载同版本单文件安装入口。Update.cmd 跟随最新正式版；更新后刷新插件并开启新对话。团队公共测试规范优先，保留项目差异；不连接机器人。"
          fi
