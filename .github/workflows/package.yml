name: Build robot test skill package
on:
  push:
    branches: [main]
    paths: ['plugin.json', 'packaging/**', 'skills/**', 'scripts/*package*.py', '.github/workflows/package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -X utf8 scripts/validate_offline.py
      - run: python -X utf8 scripts/test_sync.py
      - run: python -X utf8 scripts/test_package.py
      - run: python -X utf8 scripts/build_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: robot-test-package-${{ matrix.os }}
          path: dist/*
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: robot-test-package-ubuntu-latest
          path: dist
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v0.2.0 >/dev/null 2>&1; then
            echo "v0.2.0 already exists; keeping published assets unchanged."
          else
            gh release create v0.2.0 dist/robot-test-knowledge-0.2.0.zip dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "大象机器人测试技能包 v0.2.0" --notes "下载 ZIP 并完整解压。Windows 双击 Install.cmd 登记个人插件来源，重启桌面应用后在插件目录安装。包含用例迭代与 pytest 生成；无机器人连接。"
          fi
